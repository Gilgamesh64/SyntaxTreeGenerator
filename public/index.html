<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Syntax Tree Visualizer</title>

    <link rel="stylesheet" href="/style.css">

    <script src="/d3.v7.js"></script>

    <script src="/script.js" defer></script>
</head>

<body>

    <header>
        <h2>Syntax Tree Visualizer</h2>

        <div class="inputForm">
            <h3>Insert a sentence: </h3>
            <input type="text" id="userInput" placeholder="Enter your sentence..." />
            <button onclick="loadTree(document.getElementById('userInput').value)">
                Generate tree
            </button>
        </div>



        <div class="toolbar">
            <button id="styleToggle" class="pretty">Pretty</button>
            <button id="showEmpty" class="empty">Show Empty</button>
            <button id="zoom-in">Zoom +</button>
            <button id="zoom-out">Zoom -</button>
        </div>
    </header>

    <main>
        <div id="status">Waiting for input...</div>

        <div id="tree-container"></div>
    </main>

</body>

</html>
